<div class="orders-container">
  <h2>Order History</h2>

  <div *ngIf="loading">Loading orders...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <table *ngIf="!loading && orders.length > 0">
    <thead>
      <tr>
        <th>Order #</th>
        <th>Date</th>
        <th>Total</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{ order.orderId }}</td>
        <td>{{ order.orderDate | date:'medium' }}</td>
        <td>${{ order.totalAmount.toFixed(2) }}</td>
        <td>{{ order.status }}</td>
        <td><a [routerLink]="['/orders', order.orderId]">View Details</a></td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && orders.length === 0">No orders yet.</div>
</div>
