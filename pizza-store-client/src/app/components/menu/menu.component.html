<div class="menu-container">
  <h2>Our Pizzas</h2>

  <div *ngIf="loading">Loading menu...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div class="pizza-grid" *ngIf="!loading && !error">
    <div class="pizza-card" *ngFor="let pizza of pizzas">
      <h3>{{ pizza.name }}</h3>
      <p>{{ pizza.description }}</p>
      <p class="price">${{ pizza.price.toFixed(2) }}</p>
      <p class="stock" *ngIf="pizza.stockQuantity < 10">
        Only {{ pizza.stockQuantity }} left!
      </p>
      <button (click)="addToCart(pizza)">Add to Cart</button>
    </div>
  </div>

  <div *ngIf="!loading && !error && pizzas.length === 0">
    No pizzas available right now.
  </div>
</div>
